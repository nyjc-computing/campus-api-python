site_name: Campus API Python
site_description: >-
  Python SDK for the Campus school platform API — assignments, circles,
  files, hosted apps, submissions, timetable, auth, audit, and the
  integrations registry.
repo_url: https://github.com/nyjc-computing/campus-api-python
repo_name: nyjc-computing/campus-api-python

strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            # Static (AST) analysis. It needs the __init__.py markers on
            # the service packages (api/auth/audit/integrations) — griffe
            # cannot descend into implicit-namespace subpackages of a
            # regular parent. Dynamic inspection (force_inspection) also
            # works but materializes interpreter-specific runtime dunders
            # (__firstlineno__, __annotations__, ...) on 3.13+, which
            # render as junk on reference pages.
            docstring_style: google
            docstring_section_style: table
            members_order: source
            show_root_heading: true
            show_source: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Authentication: authentication.md
  - Tracing: tracing.md
  - Custom clients: custom-clients.md
  - Extending the SDK: extending.md
  - Reference:
      - Campus facade: reference/campus.md
      - Campus API: reference/api.md
      - Auth: reference/auth.md
      - Audit: reference/audit.md
      - Integrations: reference/integrations.md
      - Errors: reference/errors.md
